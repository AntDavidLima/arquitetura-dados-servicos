name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: pip install -r backend/requirements.txt

      - name: Executar pytest
        run: python -m pytest backend/tests -q

  smoke:
    name: Build e teste de fumaça
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Build das imagens
        run: docker compose build

      - name: Subir os containeres
        run: docker compose up -d

      - name: Aguardar o proxy responder na porta 80
        run: |
          for tentativa in $(seq 1 30); do
            if curl -fsS http://localhost/ > /dev/null 2>&1; then
              echo "Proxy respondeu na tentativa $tentativa."
              exit 0
            fi
            sleep 2
          done
          echo "O proxy não respondeu dentro de 60 segundos."
          exit 1

      - name: Teste de fumaça via proxy reverso
        run: |
          set -euo pipefail

          verificar() {
            local descricao="$1"
            local esperado="$2"
            local recebido="$3"
            if [ "$recebido" != "$esperado" ]; then
              echo "FALHOU  $descricao: esperado $esperado, recebido $recebido"
              exit 1
            fi
            echo "OK      $descricao ($recebido)"
          }

          # O proxy é o ponto único de entrada: tudo passa pela porta 80.
          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)
          verificar "GET / (frontend)" "200" "$status"

          status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/products)
          verificar "GET /api/products" "200" "$status"

          resposta=$(curl -s -w '\n%{http_code}' -X POST http://localhost/api/products \
            -H 'Content-Type: application/json' \
            -d '{"name":"Smoke Test"}')
          status=$(echo "$resposta" | tail -n 1)
          corpo=$(echo "$resposta" | head -n 1)
          verificar "POST /api/products" "201" "$status"

          id=$(echo "$corpo" | python3 -c 'import json, sys; print(json.load(sys.stdin)["id"])')

          status=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE "http://localhost/api/products/$id")
          verificar "DELETE /api/products/$id" "204" "$status"

          echo "Teste de fumaça concluído com sucesso."

      - name: Logs dos containeres em caso de falha
        if: failure()
        run: docker compose logs

      - name: Derrubar os containeres
        if: always()
        run: docker compose down -v

  push:
    name: Publicar no Docker Hub
    runs-on: ubuntu-latest
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DOCKER_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build e push com a tag do commit
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose build
          docker compose push proxy frontend backend

      - name: Build e push da tag latest
        env:
          IMAGE_TAG: latest
        run: |
          docker compose build
          docker compose push proxy frontend backend
