services:
  proxy:
    build: ./nginx
    image: ${DOCKER_NAMESPACE:-local}/arqds-proxy:${IMAGE_TAG:-latest}
    container_name: proxy_reverso
    ports:
      - "8070:80"
    depends_on:
      - frontend
      - backend
    networks:
      - app-network

  frontend:
    build: ./frontend
    image: ${DOCKER_NAMESPACE:-local}/arqds-frontend:${IMAGE_TAG:-latest}
    container_name: web_frontend
    networks:
      - app-network

  backend:
    build: ./backend
    image: ${DOCKER_NAMESPACE:-local}/arqds-backend:${IMAGE_TAG:-latest}
    container_name: api_backend
    environment:
      DB_HOST: db_oltp
      DB_PORT: 5432
      DB_USER: app_user
      DB_PASSWORD: app_pass
      DB_NAME: products_db
    depends_on:
      db_oltp:
        condition: service_healthy
    networks:
      - app-network

  db_oltp:
    image: postgres:15-alpine
    container_name: db_oltp
    environment:
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: app_pass
      POSTGRES_DB: products_db
    ports:
      - "5432:5432"
    volumes:
      - oltp_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d products_db"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  oltp_data:

