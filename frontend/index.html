<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRUD de Produtos</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 24px; background: #f7f7f7; }
    .container { max-width: 720px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; }
    form { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type="text"] { flex: 1; padding: 8px; }
    button { padding: 8px 12px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
    .actions { display: flex; gap: 8px; }
    .muted { color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Produtos</h1>
    <p class="muted">Gerencie produtos usando a API via proxy reverso em <code>/api/products</code>.</p>

    <form id="product-form">
      <input id="product-name" type="text" maxlength="50" placeholder="Nome do produto" required>
      <button type="submit">Adicionar</button>
    </form>

    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Nome</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="product-list"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById("product-form");
    const nameInput = document.getElementById("product-name");
    const list = document.getElementById("product-list");
    const API_BASE = window.location.port === "80" || window.location.port === "" ? "/api" : "http://localhost:8000/api";

    function apiUrl(path) {
      return `${API_BASE}${path}`;
    }

    async function fetchProducts() {
      const response = await fetch(apiUrl("/products"));
      const products = await response.json();

      list.innerHTML = "";
      products.forEach((product) => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${product.id}</td>
          <td>${product.name}</td>
          <td class="actions">
            <button data-action="edit" data-id="${product.id}" data-name="${product.name}">Editar</button>
            <button data-action="delete" data-id="${product.id}">Excluir</button>
          </td>
        `;
        list.appendChild(row);
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const name = nameInput.value.trim();
      if (!name) return;

      await fetch(apiUrl("/products"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name })
      });

      nameInput.value = "";
      await fetchProducts();
    });

    list.addEventListener("click", async (event) => {
      const target = event.target;
      if (!(target instanceof HTMLButtonElement)) return;

      const action = target.dataset.action;
      const id = target.dataset.id;
      if (!id) return;

      if (action === "delete") {
        await fetch(apiUrl(`/products/${id}`), { method: "DELETE" });
        await fetchProducts();
        return;
      }

      if (action === "edit") {
        const currentName = target.dataset.name || "";
        const newName = prompt("Novo nome do produto:", currentName);
        if (!newName) return;

        await fetch(apiUrl(`/products/${id}`), {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: newName.trim() })
        });

        await fetchProducts();
      }
    });

    fetchProducts();
  </script>
</body>
</html>
